plugins {
    id 'com.android.application'
}

android {
    namespace 'com.farah.maritime'
    compileSdk 36

    defaultConfig {
        applicationId 'com.farah.maritime'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (project.hasProperty('UPLOAD_STORE_FILE')) {
                storeFile file(project.property('UPLOAD_STORE_FILE'))
                storePassword project.property('UPLOAD_STORE_PASSWORD')
                keyAlias project.property('UPLOAD_KEY_ALIAS')
                keyPassword project.property('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
