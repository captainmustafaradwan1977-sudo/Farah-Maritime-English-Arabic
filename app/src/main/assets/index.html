function progress(){let n=done.length;document.getElementById('bar').style.width=(n/18*100)+'%';document.getElementById('progressText').textContent=Math.round(n/18*100)+'% completed / مكتمل · '+n+'/18';}
function home(){document.getElementById('app').innerHTML=`<div class="panel"><b>Welcome aboard! / أهلاً بك على متن السفينة</b><p>Study a topic, listen to words, save useful terms and test yourself.</p><p class="ar">ادرس موضوعاً، واستمع إلى الكلمات، واحفظ المصطلحات المهمة واختبر نفسك.</p><div class="row"><button class="btn" onclick="showVocab()">Dictionary / القاموس</button><button class="btn secondary" onclick="quiz()">Start quiz / ابدأ الاختبار</button><button class="btn gold" onclick="savedPage()">Saved / المحفوظات (${saved.length})</button></div><div class="muted" style="margin-top:9px">Quiz points / نقاط الاختبار: ${score}</div></div><div class="section-title">Ship diagram / رسم توضيحي للسفينة</div><div class="panel"><svg class="ship" viewBox="0 0 520 205" role="img" aria-label="Ship parts diagram"><path d="M40 125 L475 125 L430 175 L100 175 Z" fill="#b8d5dc" stroke="#075b68" stroke-width="3"/><rect x="170" y="70" width="150" height="55" rx="4" fill="#e9b95b" stroke="#075b68" stroke-width="2"/><rect x="345" y="85" width="70" height="40" fill="#dce8ec" stroke="#075b68" stroke-width="2"/><rect x="365" y="42" width="42" height="43" fill="#fff" stroke="#075b68" stroke-width="2"/><path d="M245 70 V25 M245 30 L285 60 M245 30 L205 60" stroke="#075b68" stroke-width="4" fill="none"/><g class="hit" onclick="part('Bow','مقدمة السفينة')"><circle cx="465" cy="145" r="10" fill="#f4b942"/><text x="430" y="195">Bow / المقدمة</text></g><g class="hit" onclick="part('Stern','مؤخرة السفينة')"><circle cx="60" cy="145" r="10" fill="#f4b942"/><text x="15" y="195">Stern / المؤخرة</text></g><g class="hit" onclick="part('Cargo hold','عنبر البضائع')"><circle cx="245" cy="100" r="9" fill="#087e8b"/><text x="188" y="92">Cargo hold</text></g><g class="hit" onclick="part('Bridge','جسر القيادة')"><circle cx="385" cy="62" r="8" fill="#087e8b"/><text x="365" y="32">Bridge</text></g><g class="hit" onclick="part('Deck','سطح السفينة')"><circle cx="135" cy="126" r="8" fill="#087e8b"/><text x="110" y="112">Deck</text></g></svg><div class="muted">Tap a marked part / اضغط على الجزء المحدد</div></div><div class="section-title">All learning modules / جميع الدروس</div><div class="grid">${modules.map((m,i)=>`<div class="tile" onclick="lesson(${i})"><b>${i+1}. ${m[0]}</b><div class="ar">${m[1]}</div><div class="muted">${done.includes(i)?'✓ Completed / مكتمل':'Open lesson / افتح الدرس'}</div></div>`).join('')}</div><div class="section-title">Daily maritime phrase / عبارة بحرية يومية</div><div class="panel"><b class="en">${phrases[new Date().getDate()%phrases.length][0]}</b><p class="ar">${phrases[new Date().getDate()%phrases.length][1]}</p><button class="btn secondary" onclick="speak('${phrases[new Date().getDate()%phrases.length][0]}')">🔊 Listen / استمع</button></div>`;progress();}
function part(en,ar){alert(en+' / '+ar);}
function lesson(i){let m=modules[i],words=lessons[i],p=phrases[i%phrases.length];document.getElementById('app').innerHTML=`<button class="btn secondary" onclick="home()">← Home / الرئيسية</button><div class="section-title">${i+1}. ${m[0]} / ${m[1]}</div><div class="panel"><p>${m[2]}</p><p class="ar">${m[3]}</p><div class="pill">Beginner / مبتدئ</div><h3>Key vocabulary / أهم المفردات</h3>${words.map((v,j)=>word(v,i+'-'+j)).join('')}<h3>Useful sentence / جملة مفيدة</h3><div class="lesson"><b class="en">${p[0]}</b><p class="ar">${p[1]}</p><button class="btn secondary" onclick="speak('${p[0]}')">🔊 Listen / استمع</button></div><h3>Safety reminder / تذكير بالسلامة</h3><div class="tip">Always follow the Master's and responsible officer's instructions, risk assessment and shipboard procedures.<div class="ar">اتبع دائماً تعليمات الربان والضابط المسؤول وتقييم المخاطر وإجراءات السفينة.</div></div><div class="row" style="margin-top:13px"><button class="btn" onclick="mark(${i})">Mark completed / تحديد كمكتمل</button><button class="btn secondary" onclick="quiz(${i})">Test this topic / اختبر هذا الدرس</button></div></div>`;}
function word(v,id){let isSaved=saved.includes(v[0]);return `<div class="word"><div><div class="en">${v[0]}</div><div class="ar">${v[1]}</div><div class="muted">${v[2]}<br><span class="ar">${v[3]}</span></div></div><div class="row"><button class="btn secondary" onclick="speak('${v[0]}')">🔊</button><button class="btn secondary" onclick="toggleSave('${v[0]}')">${isSaved?'★':'☆'}</button></div></div>`;}
function speak(w){if(window.FarahVoice)FarahVoice.speak(w);else if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.speak(u);}}
function mark(i){if(!done.includes(i))done.push(i);localStorage.setItem('farahDone',JSON.stringify(done));home();}
function toggleSave(w){saved=saved.includes(w)?saved.filter(x=>x!==w):[...saved,w];localStorage.setItem('farahSaved',JSON.stringify(saved));}
function savedPage(){let items=lessons.flat().filter(v=>saved.includes(v[0]));document.getElementById('app').innerHTML=`<button class="btn secondary" onclick="home()">← Home / الرئيسية</button><div class="section-title">Saved vocabulary / المفردات المحفوظة</div><div class="panel">${items.length?items.map(v=>word(v,'s')).join(''):'No saved words yet / لا توجد كلمات محفوظة بعد'}</div>`;}
function showVocab(){let all=lessons.flat();document.getElementById('app').innerHTML=`<button class="btn secondary" onclick="home()">← Home / الرئيسية</button><div class="section-title">Maritime dictionary / القاموس البحري</div><input id="search" placeholder="Search English or Arabic / ابحث بالإنجليزية أو العربية" oninput="filterWords()"><div class="panel" id="wordList">${all.map(v=>word(v,'d')).join('')}</div>`;}
function filterWords(){let q=document.getElementById('search').value.toLowerCase();let all=lessons.flat().filter(v=>v[0].toLowerCase().includes(q)||v[1].includes(q));document.getElementById('wordList').innerHTML=all.map(v=>word(v,'f')).join('')||'No results / لا توجد نتائج';}
const questions=[{q:'What is the front part of a ship?',ar:'ما اسم الجزء الأمامي من السفينة؟',a:['Bow / المقدمة','Stern / المؤخرة','Deck / السطح'],c:0},{q:'What is a cargo hold?',ar:'ما هو عنبر البضائع؟',a:['A kitchen / مطبخ','A cargo space / مساحة للبضائع','A lifeboat / قارب نجاة'],c:1},{q:'Which side is starboard?',ar:'أي جانب هو Starboard؟',a:['Left / الأيسر','Right / الأيمن','Rear / الخلف'],c:1},{q:'What does SWL mean?',ar:'ماذا يعني SWL؟',a:['Safe Working Load / حمولة العمل الآمنة','Sea Water Level / مستوى مياه البحر','Ship Work List / قائمة عمل السفينة'],c:0},{q:'What is an air receiver?',ar:'ما هو خزان الهواء؟',a:['Air storage tank / خزان تخزين الهواء','Water pump / مضخة مياه','Radio / جهاز لاسلكي'],c:0},{q:'What is a mooring line used for?',ar:'فيم يستخدم حبل الربط؟',a:['Painting / الدهان','Securing the vessel / تثبيت السفينة','Cooking / الطبخ'],c:1},{q:'What does ETA mean?',ar:'ماذا يعني ETA؟',a:['Estimated Time of Arrival / الوقت المتوقع للوصول','Engine Test Alarm / إنذار اختبار المحرك','Emergency Towing Area / منطقة القطر'],c:0},{q:'What is PPE?',ar:'ما هي PPE؟',a:['Personal Protective Equipment / معدات الوقاية الشخصية','Port Pilot Entry / دخول المرشد','Pressure Pump Engine / محرك مضخة الضغط'],c:0}];
function quiz(topic){let q;if(Number.isInteger(topic)&&lessons[topic]){let pool=lessons[topic],item=pool[Math.floor(Math.random()*pool.length)],all=lessons.flat(),distractors=all.filter(v=>v[1]!==item[1]).sort(()=>Math.random()-.5).slice(0,2),opts=[item,...distractors];opts.sort(()=>Math.random()-.5);q={q:'What is the Arabic meaning of "'+item[0]+'"?',ar:'ما المعنى العربي للمصطلح التالي؟ '+item[0],a:opts.map(v=>v[1]),c:opts.findIndex(v=>v[0]===item[0])};}else{q=questions[Math.floor(Math.random()*questions.length)];}document.getElementById('app').innerHTML=`<button class="btn secondary" onclick="home()">← Home / الرئيسية</button><div class="section-title">Maritime quiz / اختبار بحري</div><div class="panel"><div class="pill">${Number.isInteger(topic)&&lessons[topic]?'Topic test / اختبار الدرس':'General test / اختبار عام'}</div><h3>${q.q}</h3><div class="ar">${q.ar}</div>${q.a.map((a,i)=>`<button class="btn quizopt" onclick="answer(this,${i===q.c})">${a}</button>`).join('')}<p id="feedback"></p><button class="btn" onclick="quiz(${Number.isInteger(topic)?topic:'null'})">Next question / سؤال آخر</button></div>`;}
function answer(el,ok){document.querySelectorAll('.quizopt').forEach(b=>b.disabled=true);el.classList.add(ok?'correct':'wrong');document.getElementById('feedback').textContent=ok?'Correct! أحسنت، إجابة صحيحة.':'Incorrect. الإجابة غير صحيحة؛ راجع الدرس وحاول مجدداً.';if(ok){score++;localStorage.setItem('farahScore',String(score));}}
home();
</script></body></html>
