name: Build Farah Maritime Android releases

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Arrange Android project files
        run: |
          set -eux
          mkdir -p app/src/main/java/com/farah/maritime
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/farah/maritime/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp styles.xml app/src/main/res/values/styles.xml
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

      - name: Prepare optional Play upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/farah-upload-key.jks"
          fi

      - name: Build APK and Play Store App Bundle
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/farah-upload-key.jks" ]; then
            gradle assembleDebug bundleRelease \
              -PUPLOAD_STORE_FILE="$RUNNER_TEMP/farah-upload-key.jks" \
              -PUPLOAD_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" \
              -PUPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS" \
              -PUPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD" --stacktrace
          else
            gradle assembleDebug bundleRelease --stacktrace
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Farah-Maritime.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Farah-Maritime.aab

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Farah-Maritime-Play-Store-Build
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish public APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Farah Maritime v1.1.${{ github.run_number }}
          body: |
            Farah Maritime English and Arabic – Android APK.
            This APK is for direct Android installation. The AAB is retained as a build artifact for Play Console signing and upload.
          files: dist/Farah-Maritime.apk
          make_latest: true
