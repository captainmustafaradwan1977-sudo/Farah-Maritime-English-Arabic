name: Build RADWAN MARINE STORES FINDER APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'radwan-marine-stores-finder/**'
      - '.github/workflows/build-radwan-apk.yml'
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: radwan-marine-stores-finder
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp radwan-marine-stores-finder/app/build/outputs/apk/debug/app-debug.apk dist/RADWAN-MARINE-STORES-FINDER.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RADWAN-MARINE-STORES-FINDER-APK
          path: dist/RADWAN-MARINE-STORES-FINDER.apk
          retention-days: 90
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: radwan-v1.0.${{ github.run_number }}
          name: RADWAN MARINE STORES FINDER v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/RADWAN-MARINE-STORES-FINDER.apk
